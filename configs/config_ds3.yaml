data:
  path: data/tcm_33_anomaly4_v1.csv
  name: ds3

results_directory: "results"

x_cols: ['reduction_1', 'reduction_2', 'reduction_3',
       'reduction_4', 'tension_1', 'tension_2', 'tension_3', 'tension_4',
       'tension_5', 'roll_speed_1', 'roll_speed_2', 'roll_speed_3',
       'roll_speed_4', 'force_1', 'force_2', 'force_3', 'force_4', 'torque_1',
       'torque_2', 'torque_3', 'torque_4', 'gap_1', 'gap_2', 'gap_3', 'gap_4',
       'current_1', 'current_2', 'current_3', 'current_4']

y_col: "class"


detector:
  reference_size: 10
  window_size: 2
  min_instances: 1
  delta: 0.005
  threshold: 2500
  alpha: 0.9999

engine:
  # Fixed labeled source prefix. Labels at indices >= source_size are used
  # exclusively for evaluation and never for training or adaptation.
  source_size: 3000
  window_size: 50

predictor:
  # Domain-adversarial loss weight (lambda in DANN).
  lambda: 0.00003
  learning_rate: 0.0003
  gamma: 2.0
  class_balance: True
  alpha: 0.5
  epochs: 120
  batch_size: 128
  threshold: 0.5
  pretrain_epochs: 500
  pretrain_validation_split: 0.2
  pretrain_patience: 20

network:
    encoder:
        latent_dim: 8
        learning_rate: 0.0001
    task:
        latent_dim: 8
        learning_rate: 0.0003
        gamma: 2.0
        alpha: 0.5
    discriminator:
        latent_dim: 8
        discriminator_learning_rate: 0.00001

logging:
  # INFO: lifecycle, shapes, ranges and parameters. DEBUG additionally prints
  # per-feature scaler ranges and individual prediction scores.
  level: INFO
